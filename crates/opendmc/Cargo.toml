[package]
name = "opendmc"
version = "0.1.0"
description = "OpenDMC game shell (Bevy). Runs a graybox training room without game data; loads your own files when pointed at them."
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# Controller support needs libudev headers on Linux.
gamepad = ["bevy/bevy_gilrs"]

[dependencies]
dmc-formats.workspace = true
dmc-sim.workspace = true
ron.workspace = true
serde.workspace = true
bevy = { version = "0.18.1", default-features = false, features = [
    "default_app",
    "std",
    "multi_threaded",
    "bevy_winit",
    "x11",
    "default_font",
    "3d_bevy_render",
    "ui_bevy_render",
    "tonemapping_luts",
] }
